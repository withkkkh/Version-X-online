<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>软件团队知识图谱 · VERSION X</title>
  <link rel="stylesheet" href="./style.css?v=9">
  <link rel="stylesheet" href="./knowledge.css?v=27">
  <script type="module" src="./knowledge.js?v=28"></script>
<link rel="stylesheet" href="./cursor.css?v=44"><script defer src="./cursor.js?v=44"></script>
<link rel="stylesheet" href="./exhibition-vi.css?v=8">
</head>
<body class="knowledge-page">
<header class="mast">
  <span class="map-mast-label"><img class="exhibition-wordmark" src="./assets/exhibition-wordmark.svg" alt="VERSION X · 未完之境" width="275" height="104"></span>
  <nav aria-label="展馆导航">
    <a class="exhibit-nav-link" href="./?entry=return-from-map" target="_top"><span class="nav-mark back" aria-hidden="true"></span>返回主展馆</a>
    <a class="exhibit-nav-link knowledge-back" href="./story-software.html" target="_top"><span class="nav-mark back" aria-hidden="true"></span><span id="team-return-label">返回软件展区</span></a>
  </nav>
</header>
<main class="map-page">
  <div class="map-heading">
    <div class="map-title-row">
        <img class="map-emblem" src="./assets/map-liquid-x.webp" width="128" height="128" alt="">
        <h1 id="graph-title">软件团队知识图谱</h1>
    </div>
    <nav class="map-teams" aria-label="团队知识图谱">
      <a class="exhibit-nav-link" href="./knowledge.html?team=software" data-team="software">软件</a>
      <a class="exhibit-nav-link" href="./knowledge.html?team=hardware" data-team="hardware">硬件</a>
      <a class="exhibit-nav-link" href="./knowledge.html?team=design" data-team="design">设计</a>
      <a class="exhibit-nav-link" href="./knowledge.html?team=operations" data-team="operations">运营</a>
    </nav>
  </div>
  <section class="map-shell" aria-labelledby="graph-title">
    <div class="map-bar">
      <p id="map-help"><span class="desktop-hint">拖动画布 · 点击节点</span><span class="touch-hint">滑动画布 · 点击节点</span></p>
      <div class="map-tools">
        <button type="button" id="map-minus" aria-label="缩小图谱" title="缩小">−</button>
        <output id="map-zoom" aria-label="图谱缩放比例">100%</output>
        <button type="button" id="map-plus" aria-label="放大图谱" title="放大">+</button>
        <button type="button" id="map-home" title="回到图谱起点">起点</button>
        <button type="button" id="map-legend-button" aria-expanded="false" aria-controls="map-legend">图例</button>
      </div>
    </div>
    <div class="map-field">
      <div class="map-viewport" id="map-viewport" tabindex="0" role="region" aria-label="互动图谱画布" aria-describedby="map-help">
        <div class="map-space" id="map-space"><div class="map-art" id="map-art"></div></div>
      </div>
      <p class="map-status" id="map-status" role="status">正在载入图谱…</p>
      <aside class="map-popover map-legend" id="map-legend" aria-label="图例" hidden>
        <div class="legend-col">
          <span><i class="level-sample chapter"></i>路线重点</span>
          <span><i class="level-sample required"></i>必学</span>
          <span><i class="level-sample recommended"></i>建议掌握</span>
          <span><i class="level-sample advanced"></i>进阶拓展</span>
        </div>
        <div class="legend-col">
          <span><i class="relation-sample prerequisite"></i>依赖关系</span>
          <span><i class="relation-sample supplementary"></i>补充关系</span>
          <span><i class="relation-sample inclusion"></i>包含关系</span>
        </div>
      </aside>
      <aside class="map-popover map-inspector" id="map-inspector" aria-labelledby="node-title" hidden>
        <button type="button" id="node-close" aria-label="关闭节点详情">×</button>
        <span class="node-level" id="node-level"></span>
        <h2 id="node-title"></h2>
        <p id="node-detail" hidden></p>
      </aside>
    </div>
    <div class="map-navigator">
      <button type="button" id="map-prev" aria-label="向左查看图谱" title="向左查看">←</button>
      <div class="map-overview">
        <svg id="mini-map" viewBox="0 0 700 32" preserveAspectRatio="none" aria-hidden="true"></svg>
        <input id="map-position" type="range" min="0" max="1000" value="0" aria-label="图谱横向位置">
      </div>
      <button type="button" id="map-next" aria-label="向右查看图谱" title="向右查看">→</button>
    </div>
  </section>
</main>
<noscript><p class="map-noscript">请启用 JavaScript 以浏览互动图谱。</p></noscript>
</body>
</html>
