<body><header><div class="bar"><div class="brand"><span class="mark" aria-hidden="true"></span><span>小默 <i>Desk Buddy</i></span></div><button id="reset" class="textbtn" type="button">恢复示例笔记</button></div></header>
<main><div class="intro"><h1>小默互动工作台</h1><p>改写一条待办，或勾选已完成的任务，看看小默屏幕上的变化。</p></div>
<div class="layout">
<section class="card" id="notes"><div class="panelhead"><h2><span class="symbol" aria-hidden="true">#</span>Obsidian 笔记</h2><div class="actionrow"><a href="#device-panel" class="jump">看模拟屏</a><button type="button" id="import-note" class="sync" title="从 Obsidian 笔记库选择一个 Markdown 文件">导入笔记</button><input type="file" id="note-file" accept=".md,.markdown" hidden></div></div>
<div class="editing"><div class="editor"><div class="filebar"><span id="source-name">今日笔记.md</span><div class="file-tools"><button id="reload-note" type="button" hidden>重新读取原文</button><span id="file-type">Markdown</span></div></div><div class="noteinput"><div class="gutter" id="gutter" aria-hidden="true"></div><textarea id="note" aria-label="编辑 Obsidian 笔记" spellcheck="false" wrap="off"></textarea></div></div><p id="import-status" class="import-info" role="status"></p>
<div class="subbar"><label class="check"><input id="autosync" type="checkbox" checked>实时同步</label><button type="button" class="sync" id="send">同步到小默</button></div></div>
<div class="result"><div class="resulttitle"><h3>解析结果</h3><select id="scope" class="scope" aria-label="笔记解析范围"><option value="auto">自动识别章节</option><option value="sections">只读小默章节</option><option value="whole">读取整篇笔记</option></select></div><div class="scope-info" id="scope-info" hidden></div><ul id="tasks" class="list"></ul><p><b>备注</b><span id="remark"></span></p><ul class="warning" id="warnings" hidden></ul></div></section>
<section class="card" id="device-panel"><div class="panelhead"><h2><span class="symbol lcdsymbol" aria-hidden="true"></span>小默模拟屏</h2><button type="button" class="sync" id="sound" aria-pressed="false">开启声音</button></div>
<div class="devicearea"><div class="device" id="device"><div id="moving-head"><div class="platehead"><span>DESK BUDDY</span><span class="speaker" aria-hidden="true"></span></div><div class="glass"><canvas id="screen" width="640" height="480" aria-label="小默模拟屏" role="img"></canvas></div></div><div class="keys" id="keys"></div></div></div>
<div class="status" role="status" aria-live="polite"><i id="led"></i><span id="statusText"></span><span id="screenPage" class="mono"></span></div>
<div class="tools"><p class="keysHelp">按住 SW6 满 0.8 秒，让小默回到常态、两轴归中。按住其他任一键满 0.8 秒会响三声提醒音。</p></div></section>
</div></main>
<script>// Browser port of Desk Buddy's tools/companion/task_parser.py and parse_preview.
(() => {
  "use strict";
  const utf8 = new TextEncoder();
  const headingPattern = /^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/u;
  const taskPattern = /^(\s*[-*+]\s*\[)([ xX])\]\s+(.+?)\s*$/u;
  const anyTask = /^\s*[-*+]\s*\[.\]/u;
  const fencePattern = /^ {0,3}(\x60{3,}|~{3,})(.*)$/u;
  const metadata = /[📅⏳🛫⏰🔁➕⏫🔼🔽✅❌🆔]/u;
  const isSection = title => title === "小默任务" || title === "小默备注";

  function plainText(text) {
    return text
      .replace(/!\[\[[^\]]*\]\]/gu, "")
      .replace(/!\[[^\]]*\]\([^)]*\)/gu, "")
      .replace(/\[\[([^\]]+)\]\]/gu, (_, link) => link.split("|").pop())
      .replace(/\[([^\]]+)\]\([^)]*\)/gu, "$1")
      .replace(/\[[\p{L}\p{N}_-]+::[^\]]*\]/gu, "")
      .replace(/(?<!\S)#[\p{L}\p{N}_/-]+/gu, "")
      .replace(/(\x60+|\*{1,3}|_{1,3}|~~|==)(.+?)\1/gu, "$2")
      .replace(/\s+/gu, " ").trim();
  }

  function visibleLines(text) {
    const lines = [];
    let frontmatter = false, inComment = false, fence = "";
    let lineNumber = 0, lineStart = 0;
    // Match Python splitlines(), preserving source offsets even with CRLF.
    const lineEnds = /\r\n|[\n\r\v\f\x1c-\x1e\x85\u2028\u2029]/gu;
    for (const end of [...text.matchAll(lineEnds), { index: text.length, 0: "" }]) {
      lineNumber++;
      let start = lineStart;
      if (lineNumber === 1) {
        while (text[start] === "\uFEFF") start++;
      }
      const raw = text.slice(start, end.index);
      lineStart = end.index + end[0].length;
      if (lineNumber === 1) frontmatter = raw.trim() === "---";
      if (frontmatter) {
        if (lineNumber > 1 && ["---", "..."].includes(raw.trim())) frontmatter = false;
        continue;
      }
      if (fence) {
        const closing = fencePattern.exec(raw);
        if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length && !closing[2].trim()) fence = "";
        continue;
      }
      let position = 0, cleaned = "";
      const spans = [];
      while (position < raw.length) {
        if (inComment) {
          const close = raw.indexOf("-->", position);
          if (close < 0) break;
          position = close + 3;
          inComment = false;
        } else {
          const open = raw.indexOf("<!--", position);
          const until = open < 0 ? raw.length : open;
          if (position < until) {
            spans.push({offset: start + position, from: cleaned.length});
            cleaned += raw.slice(position, until);
          }
          if (open < 0) break;
          position = open + 4;
          inComment = true;
        }
      }
      const opening = fencePattern.exec(cleaned);
      if (opening) {
        fence = opening[1];
        continue;
      }
      if (cleaned.trimStart().startsWith(">")) continue;
      lines.push({cleaned, spans, lineNumber, heading: headingPattern.exec(cleaned)});
    }
    return lines;
  }

  function truncateUtf8(text, limit) {
    if (utf8.encode(text).length <= limit) return text;
    let length = 0, result = "";
    for (const character of text) {
      length += utf8.encode(character).length;
      if (length > limit - 3) break;
      result += character;
    }
    return result + "…";
  }

  // Keep IDs synchronous for local-file previews, matching hashlib.sha256(...).hexdigest()[:32].
  const shaConstants = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const rotate = (word, by) => (word >>> by) | (word << (32 - by));
  function taskId(source, title, count) {
    const data = utf8.encode(source + "\0" + title + "\0" + count);
    const padded = new Uint8Array(Math.ceil((data.length + 9) / 64) * 64);
    padded.set(data);
    padded[data.length] = 0x80;
    const view = new DataView(padded.buffer);
    const bits = data.length * 8;
    view.setUint32(padded.length - 8, Math.floor(bits / 0x100000000));
    view.setUint32(padded.length - 4, bits >>> 0);
    const state = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const words = new Uint32Array(64);
    for (let block = 0; block < padded.length; block += 64) {
      for (let i = 0; i < 16; i++) words[i] = view.getUint32(block + i * 4);
      for (let i = 16; i < 64; i++) {
        const x = words[i - 15], y = words[i - 2];
        const s0 = rotate(x, 7) ^ rotate(x, 18) ^ (x >>> 3);
        const s1 = rotate(y, 17) ^ rotate(y, 19) ^ (y >>> 10);
        words[i] = words[i - 16] + s0 + words[i - 7] + s1;
      }
      let [a,b,c,d,e,f,g,h] = state;
      for (let i = 0; i < 64; i++) {
        const sum1 = rotate(e, 6) ^ rotate(e, 11) ^ rotate(e, 25);
        const choose = (e & f) ^ (~e & g);
        const t1 = h + sum1 + choose + shaConstants[i] + words[i];
        const sum0 = rotate(a, 2) ^ rotate(a, 13) ^ rotate(a, 22);
        const majority = (a & b) ^ (a & c) ^ (b & c);
        h=g; g=f; f=e; e=(d+t1) | 0;
        d=c; c=b; b=a; a=(t1+sum0+majority) | 0;
      }
      [a,b,c,d,e,f,g,h].forEach((value, i) => { state[i] = (state[i] + value) >>> 0; });
    }
    return "t:" + state.slice(0, 4).map(word => word.toString(16).padStart(8, "0")).join("");
  }

  window.parseBuddyNote = function parseBuddyNote(text, scope = "auto", source = "today") {
    if (!["auto", "sections", "whole"].includes(scope)) throw new RangeError("scope must be auto, sections or whole");
    const lines = visibleLines(text);
    const hasSections = lines.some(row => row.heading && isSection(row.heading[2]));
    const resolved = scope === "auto" ? (hasSections ? "sections" : "whole") : scope;
    const warnings = new Set(), occurrences = new Map();
    const tasks = [], remarkLines = [];
    if (resolved === "sections" && !hasSections) warnings.add("未找到“小默任务”或“小默备注”章节，本次结果为空。");
    let section = "", sectionLevel = 0;
    for (const {cleaned, heading, spans, lineNumber} of lines) {
      if (heading) {
        if (heading[1].length <= sectionLevel) section = "";
        if (isSection(heading[2])) {
          section = heading[2];
          sectionLevel = heading[1].length;
        }
        continue;
      }
      const task = taskPattern.exec(cleaned);
      const allowTask = resolved === "whole" || section === "小默任务";
      if (task && allowTask) {
        const title = plainText(task[3].split(metadata, 1)[0].trim());
        if (!title) continue;
        const count = (occurrences.get(title) || 0) + 1;
        occurrences.set(title, count);
        // Position of the editable state character, including any hidden inline comments.
        const index = task[1].length;
        const span = spans.filter(part => part.from <= index).pop();
        tasks.push({
          id: taskId(source, title, count), title, completed: task[2].toLowerCase() === "x",
          line: lineNumber, checkboxOffset: span.offset + index - span.from,
          display_title: truncateUtf8(title, 63), will_send: tasks.length < 50
        });
      } else if (anyTask.test(cleaned)) {
        if (!task && allowTask) warnings.add("存在未识别的复选框状态；仅支持 [ ]、[x] 和 [X]。");
      } else if (resolved === "whole" || section === "小默备注") {
        const stripped = cleaned.trim();
        if (!stripped || /^(---|\*\*\*|___|\||!\[)/u.test(stripped)) continue;
        const remark = plainText(stripped);
        if (remark) remarkLines.push(remark);
      }
    }
    const remarks = remarkLines.join("；");
    if (tasks.length > 50) warnings.add("共解析 " + tasks.length + " 条任务，设备仅接收前 50 条，其余 " + (tasks.length - 50) + " 条未发送。");
    if (tasks.some(task => task.will_send && task.title !== task.display_title)) warnings.add("部分标题超过设备长度，将按完整字符缩短并显示省略号；下方保留完整标题。");
    const displayRemarks = truncateUtf8(remarks, 127);
    if (remarks !== displayRemarks) warnings.add("备注超过设备长度，发送时将缩短并显示省略号。");
    if ([...occurrences.values()].some(count => count > 1)) warnings.add("存在同名任务，按出现顺序区分；建议使用不同标题。");
    return {
      scope: resolved, total: tasks.length, sent_count: Math.min(tasks.length, 50), tasks,
      remarks, display_remarks: displayRemarks, warnings: [...warnings]
    };
  };
})();
</script>

<script>// TMB12A05 active buzzer. Pulse timings are from components/devices/buzzer.c.
(() => {
  'use strict';
  const frequency = 2400;
  const patterns = {
    short:    {count: 1, onMs: 80,  offMs: 0},
    done:     {count: 2, onMs: 60,  offMs: 60},
    reminder: {count: 3, onMs: 150, offMs: 100},
    error:    {count: 2, onMs: 300, offMs: 100}
  };
  let context = null, muted = true, availableAt = 0;
  const active = new Set();

  async function enable() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return false;
    try {
      context ??= new Audio();
      muted = false;
      if (context.state !== 'running') await context.resume();
      return !muted && context.state === 'running';
    } catch {
      mute();
      return false;
    }
  }

  function mute() {
    muted = true;
    availableAt = 0;
    for (const oscillator of active) {
      oscillator.disconnect();
      oscillator.stop();
    }
    active.clear();
  }

  function play(tone) {
    if (muted || !context || context.state === 'closed' || !Object.hasOwn(patterns, tone)) return false;
    const {count, onMs, offMs} = patterns[tone];
    const start = Math.max(context.currentTime, availableAt);
    for (let i = 0; i < count; i++) {
      const from = start + i * (onMs + offMs) / 1000;
      const to = from + onMs / 1000;
      const oscillator = context.createOscillator();
      const envelope = context.createGain();
      // The hardware sets a GPIO level. The browser synthesizes its fixed pitch
      // with short amplitude ramps to avoid speaker clicks at pulse boundaries.
      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      envelope.gain.setValueAtTime(0, from);
      envelope.gain.linearRampToValueAtTime(0.065, from + 0.003);
      envelope.gain.setValueAtTime(0.065, to - 0.004);
      envelope.gain.linearRampToValueAtTime(0, to);
      oscillator.connect(envelope);
      envelope.connect(context.destination);
      oscillator.onended = () => {
        oscillator.disconnect();
        envelope.disconnect();
        active.delete(oscillator);
      };
      active.add(oscillator);
      oscillator.start(from);
      oscillator.stop(to);
    }
    // The event loop also waits for the final off interval in buzzer_play_pattern().
    availableAt = start + count * (onMs + offMs) / 1000;
    return true;
  }

  window.buddyAudio = {enable, mute, play, get muted() { return muted; }};
})();

<script>// Local file access is read-only. A reusable file handle can follow external saves.
function bindNoteImport(onRead) {
  const control = id => document.getElementById(id);

  function message(text, error = false) {
    status.textContent = text;
    status.dataset.error = String(error);

    polling = null;

    let encoding = "utf-8";
    if (bytes[0] === 0xff && bytes[1] === 0xfe) encoding = "utf-16le";
    if (bytes[0] === 0xfe && bytes[1] === 0xff) encoding = "utf-16be";
    try {
      return new TextDecoder(encoding, {fatal:true}).decode(bytes).replace(/\r\n?/g, "\n");
    } catch {
      throw new Error("无法解码这篇笔记。请在 Obsidian 中将它另存为 UTF-8 Markdown 后再导入。");
    }

    const text = await decode(file);
    if (ticket !== operation) return;

    onRead(text, file.name, true);
    control("source-name").textContent = file.name;
    control("source-name").title = file.name;
    reload.hidden = !handle;
    if (handle) {
      follow();
      message(linkedHint);
    } else message("已导入本地副本。在 Obsidian 修改后，可再次选择这篇笔记。");
  }
  function readError(error) {
    if (error instanceof DOMException) return "暂时无法读取原文件。请检查文件位置与读取权限，再重新选择笔记。";

      current.modified = file.lastModified;
      current.size = file.size;
      current.failures = 0;

  }

    if (!usePicker) { input.click(); return; }
    const ticket = ++operation;
    let handle;
    try {
      [handle] = await window.showOpenFilePicker({multiple:false,
        types:[{description:"Obsidian Markdown 笔记", accept:{"text/markdown":[".md",".markdown"]}}]});
    } catch (error) {
      if (ticket !== operation || error.name === "AbortError") return;

      usePicker = false;
      message("可用普通文件选择器导入。请点击「导入笔记」选择 .md 文件。");
      return;
    }
    if (!handle || ticket !== operation) return;
    try { await load(await handle.getFile(), handle, ticket); }
    catch (error) { if (ticket === operation) message(readError(error), true); }
  });

    const file = input.files[0];

    try { await load(file, null, ticket); }

      if (!source?.handle || polling === null) return;
      stopPolling();

    },
    reset() {
      ++operation;
      source = null;
      stopPolling();
      reload.hidden = true;
      control("source-name").textContent = "今日笔记.md";
      control("source-name").removeAttribute("title");
      message("");
    }

    "",
    "## 日记",
    "- [ ] 记下今天逛展的灵感"
  ].join("\n");
  const note = byId("note"), autosync = byId("autosync"), canvas = byId("screen");
  const status = byId("statusText"), gutter = byId("gutter");
  let draft, pending, composing = false, lastSent;
  let sourceKey = "today", sourceVersion = 0, screenSource = -1;
  let imported = false, screen;
  let lastAnnouncement = "";
  const screenOptions = {
    onChange(state) {
      canvas.dataset.page = state.page;
      canvas.dataset.expression = state.expression;
      canvas.dataset.done = state.done;
      canvas.dataset.total = state.total;
      canvas.dataset.mode = state.mode;
      canvas.dataset.action = state.action;
      byId("led").style.backgroundColor = state.led;
      const label = state.page === "todo" ? "任务页" : "表情页";
      byId("screenPage").textContent = label + " · " + state.done + "/" + state.total;
      canvas.setAttribute("aria-label", "小默" + label + "，完成 " + state.done + " / " + state.total + " 项。" + state.message);
      if (lastAnnouncement !== state.message) {
        status.textContent = state.message;
        lastAnnouncement = state.message;
      }
    },
    onTone(tone) { window.buddyAudio.play(tone); },
    onPose({yaw, pitch}) {
      byId("moving-head").style.transform = yaw || pitch
        ? "perspective(650px) rotateY(" + yaw + "deg) rotateX(" + pitch + "deg)" : "";
    }
  };
  function sync() {
    clearTimeout(pending);
    if (sourceVersion !== screenSource) {
      screen?.destroy();
      screen = window.buddyScreen.mount(canvas, screenOptions);
      screenSource = sourceVersion;
    }
    screen.update(draft);
    lastSent = draft;
    byId("send").textContent = "同步到小默";
  }
  function renderDraft(immediate = false) {
    clearTimeout(pending);
    const source = note.value;
    draft = window.parseBuddyNote(source, byId("scope").value, sourceKey);
    const scopeInfo = byId("scope-info");
    scopeInfo.hidden = !imported;
    scopeInfo.textContent = draft.scope === "sections" ? "读取范围：小默任务和小默备注" : "读取范围：整篇笔记";
    const list = byId("tasks");
    const focusLine = list.contains(document.activeElement) ? document.activeElement.dataset.line : null;
    const items = document.createDocumentFragment();
    for (const t of draft.tasks) {
      const li = document.createElement("li"), label = document.createElement("label");
      const box = document.createElement("input"), title = document.createElement("span");
      box.type = "checkbox";
      box.checked = t.completed;
      box.dataset.line = t.line;
      box.dataset.offset = t.checkboxOffset;
      title.textContent = t.title;
      label.append(box, title);
      li.append(label);
      items.append(li);
    }
    if (!draft.total) {
      const item = document.createElement("li");
      item.className = "empty";
      item.textContent = "还没有任务。试着在笔记里写下 - [ ] 和一件想做的事。";
      items.append(item);
    }
    list.replaceChildren(items);
    if (focusLine) list.querySelector('input[data-line="' + focusLine + '"]')?.focus({preventScroll:true});
    byId("remark").textContent = draft.remarks || "暂无";
    const warnings = byId("warnings");
    warnings.replaceChildren(...draft.warnings.map(message => {
      const item = document.createElement("li"); item.textContent = message; return item;
    }));
    warnings.hidden = !draft.warnings.length;
    gutter.textContent = source.split("\n").map((_, i) => i + 1).join("\n");
    gutter.scrollTop = note.scrollTop;
    if (autosync.checked || !lastSent) {
      if (immediate) sync();
      else pending = setTimeout(sync, 550);
    } else {
      byId("send").textContent = "同步当前草稿";
    }
  }
  const files = bindNoteImport((text, filename, newSource) => {
    if (newSource) {
      sourceVersion++;
      note.scrollTop = 0;
    }
    imported = true;
    sourceKey = filename.replace(/\.(md|markdown)$/i, "");
    note.value = text;
    renderDraft(true);
  });
  byId("tasks").addEventListener("change", event => {
    const box = event.target;
    if (box.type !== "checkbox") return;
    files.edited();
    const offset = Number(box.dataset.offset);
    note.setRangeText(box.checked ? "x" : " ", offset, offset + 1, "preserve");
    renderDraft(true);
  });
  note.addEventListener("compositionstart", () => { files.edited(); composing = true; clearTimeout(pending); });
  note.addEventListener("compositionend", () => { composing = false; renderDraft(); });
  note.addEventListener("input", () => { files.edited(); if (!composing) renderDraft(); });
  note.addEventListener("scroll", () => { gutter.scrollTop = note.scrollTop; });
  byId("scope").addEventListener("change", () => renderDraft(true));
  byId("send").addEventListener("click", sync);
  autosync.addEventListener("change", () => { if (autosync.checked) sync(); else clearTimeout(pending); });
  byId("reset").addEventListener("click", () => {
    files.reset();
    sourceVersion++;
    imported = false;
    sourceKey = "today";
    note.value = sample;
    note.scrollTop = 0;
    byId("scope").value = "auto";
    renderDraft(true);
  });
  const sound = byId("sound");
  sound.addEventListener("click", async () => {
    if (window.buddyAudio.muted) {
      if (!await window.buddyAudio.enable()) {
        status.textContent = "当前浏览器无法开启声音";
        return;
      }
    } else window.buddyAudio.mute();
    const enabled = !window.buddyAudio.muted;
    sound.textContent = enabled ? "关闭声音" : "开启声音";
    sound.setAttribute("aria-pressed", String(enabled));
  });
  // A stable press lasts at least 800 ms. Each press generates exactly one event.
  const keyActions = [
    ["SW3", "切页", "切换任务页与表情页"], ["SW4", "专注", "专注表情与点头"],
    ["SW5", "提醒", "提醒表情与张望"], ["SW6", "庆祝", "庆祝，长按归中"]
  ];
  for (const [key, name, description] of keyActions) {
    const button = document.createElement("button");
    button.type = "button"; button.className = "key"; button.id = key;
    button.setAttribute("aria-label", key + " " + description);
    button.innerHTML = '<span class="keycode"></span><span class="keycap" aria-hidden="true"></span><span class="keyname"></span>';
    button.querySelector(".keycode").textContent = key;
    button.querySelector(".keyname").textContent = name;
    byId("keys").append(button);
    let heldBy = null, started, longFired = false, timeout, ignoreClick = false;
    function cancel() {
      clearTimeout(timeout);
      heldBy = null;
      button.classList.remove("held");
    }
    function begin(owner) {
      if (heldBy !== null) return;
      heldBy = owner;
      started = performance.now();
      longFired = false;
      ignoreClick = true;
      button.classList.add("held");
      timeout = setTimeout(() => { longFired = true; screen.press(key + "_LONG"); }, 800);
    }
    function release(owner) {
      if (owner !== heldBy) return;
      if (!longFired) screen.press(performance.now() - started >= 800 ? key + "_LONG" : key);
      cancel();
    }
    button.addEventListener("pointerdown", e => {
      if (e.button !== 0 || !e.isPrimary) return;
      button.setPointerCapture(e.pointerId);
      begin(e.pointerId);
    });
    button.addEventListener("pointerup", e => release(e.pointerId));
    button.addEventListener("pointercancel", cancel);
    button.addEventListener("lostpointercapture", e => { if (heldBy === e.pointerId) cancel(); });
    button.addEventListener("contextmenu", e => e.preventDefault());
    button.addEventListener("keydown", e => {
      if (e.key !== " " && e.key !== "Enter") return;
      e.preventDefault(); if (!e.repeat) begin(e.key);
    });
    button.addEventListener("keyup", e => {
      if (e.key !== " " && e.key !== "Enter") return;
      e.preventDefault(); release(e.key); ignoreClick = false;
    });
    button.addEventListener("click", e => {
      if (e.detail === 0 && heldBy === null && !ignoreClick) screen.press(key);
      ignoreClick = false;
    });
    const abort = () => { cancel(); ignoreClick = false; };
    button.addEventListener("blur", abort);
    window.addEventListener("blur", abort);
    document.addEventListener("visibilitychange", () => { if (document.hidden) abort(); });
  }
  note.value = sample;
  renderDraft(true);
})();
</script>
</body></html>
