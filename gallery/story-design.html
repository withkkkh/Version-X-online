<main><div class="lead"><div><p class="team">设计团队</p><h1>水面之下，帐篷之内</h1><p>同一个人，站在水面上和没入水中时，会看见怎样不同的世界？设计展区的两件装置，把这个问题从身体的感受带到记忆里的场景。</p></div>
<figure><model-viewer src="./assets/version-x-gallery-v29.glb" camera-target="0m 1.33m -6.36m" camera-orbit="9deg 65deg 7m" field-of-view="42deg" exposure=".87" environment-image="neutral" interaction-prompt="none" alt="设计展架上的《向上沉没》与《回家核》"></model-viewer><figcaption>设计展区 · 向上沉没 / 回家核</figcaption></figure></div>
<div class="works"><section><h2>向上沉没</h2><p>先看水波，再看透过水波的东西。气泡、折射和水面把视线分成两边。作品把出水与入水的感受并置，邀请你想一想：明明是同一束光，为什么换个位置，眼前的世界就变了？</p></section><section><h2>回家核</h2><p>视线从水面转向一顶帐篷。粉紫色的暮色、便利店和一场骤雨，串起一段回家的路。你最先想起的会是哪一种声音、哪一束灯光？这件作品用五感来讲述童年记忆。</p></section></div></main>
