<main><div class="lead"><div><p class="team">硬件团队</p><h1>让一个指令变成一个动作</h1><p>发出指令之后，怎样才算机器听懂了？在一件作品里，答案是四条腿协调地向前迈步；在另一件里，是桌上的一朵花朝你转过来。</p></div>
<figure><model-viewer data-story data-src="./assets/version-x-gallery-v30.glb" camera-target="7.57m 1.33m 0m" camera-orbit="-82deg 67deg 7m" field-of-view="42deg" exposure=".87" environment-image="neutral" interaction-prompt="none" alt="硬件展架上的《四足机器人》与《机械花》"></model-viewer><figcaption>硬件展区 · 四足机器人 / 机械花</figcaption></figure></div>
<div class="works"><section><h2>四足机器人</h2><p>从网页发出前进、转向或站立的指令，指令通过无线通信传给机器人，再由舵机带动四条腿。观察它转身时每条腿的动作，就能看见一个简单指令背后的配合。</p></section><section><h2>机械花</h2><p>把交互的起点换成声音，机器的回应也换了一种样子。这朵桌面机械花用前倾、旋转、灯光和彩屏表情回应语音。你会先从哪个动作判断，它听见了？</p></section></div></main>
