<div class="project-intro"><p>设计说明</p><p>本装置以童年梦核为主题，依托身体、视听触五大感官要素搭建帐篷空间，还原干禧年老小区黄昏却增加了奇幻怪诞的氛围：以回家为主线，粉紫暮色.摇晃游乐设施、老街便利店、骤雨居民楼层层递进.</p><p>借沙中糖纸、摇摇车、冰柜.雨声等视觉与听觉意象，把朦胧怀旧的童年感官记忆变成荒诞不羁一场的圣梦，在越来越黑的天色中，体验者终于回到温暖的家中</p></div><figure class="work-plate"><img src="../assets/projects/11-work.webp" alt="作品设计展板" loading="lazy"><figcaption>作品设计展板</figcaption></figure><nav class="series-nav" aria-label="项目导航"><a href="../story-design.html#project-index">全部设计项目</a><a href="./vx-019.html">下一个项目 · 设计训练营期间成果</a></nav></main></body></html>
