<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">S01 / 软件团队 · 软件展示</div><h1>Honesight</h1><nav class="project-resources" aria-label="项目入口"><a href="http://honesight.top" target="_blank" rel="noopener noreferrer">在线体验</a></nav></header><div class="spread-text"><div class="project-intro"><p>HONESIGHT 是一个面向摄影爱好者的学习与交流平台，围绕“学会观察、学会拍摄”的理念，帮助用户从随手拍摄走向有意识的练习与创作。平台提供每周摄影任务、今日灵感、AI 摄影分析、个人作品集、摄影社区和成长记录等功能。用户可以选择练习主题，上传真实照片，获得关于曝光、对焦、构图和色彩的具体反馈，并根据建议改进下一次拍摄。作品与练习记录会沉淀在个人主页中，形成“选择练习—拍摄上传—获得反馈—整理作品—持续成长”的完整摄影学习闭环。</p></div></div></div><section class="spread-media object-only" aria-label="项目图像与视频"><figure><img src="../assets/archive-objects/050.svg" alt="每周摄影任务卡"><figcaption>策展插图 · 每周摄影任务卡</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-software.html#project-index">全部软件项目</a><a href="./vx-053.html">下一个项目 · CC98 AI+插件</a></nav></main></body></html>
