<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">H09 / 硬件团队 · 实体展示</div><h1>Typhoon Capsule 飓风胶囊</h1></header><div class="spread-text"><div class="project-intro"><p>把一阵风装进“胶囊”，能做什么？</p><p>Typhoon Capsule 飓风胶囊是一台便携式模块化吹吸工具：接上尘杯与滤芯，它能收集桌面碎屑；换上气嘴，它能低压充气、抽走收纳袋里的空气。</p><p>从重新设计保护板、点焊电池包，到修改漏风中框，飓风胶囊在一次次返工中成形。它的另一半，是一个让建模新手也能参与创造的参数化网页。选择模板、调整尺寸、预览形状，再导出模型进行3D打印，就能尝试为自己的需求制作附件。 它也留下一个开放的邀请：下一种用途，由你来定义。</p></div></div></div><section class="spread-media object-only" aria-label="项目图像与视频"><figure><img src="../assets/archive-objects/026.svg" alt="可替换的风机气嘴"><figcaption>策展插图 · 可替换的风机气嘴</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-026">返回硬件项目索引</a></nav></main></body></html>
