<div class="project-intro"><p>CharacterOS 是一个面向剧情驱动型游戏研发团队的剧情研发顾问服务项目，关注版本更新中角色设定、知情时间、世界规则与剧情分支难以保持一致的问题。团队基于多方向探索、访谈和167份用户问卷汇总，将现阶段重点收敛到B端服务。</p><p>项目计划通过“AI初筛风险—顾问结合上下文复核—研发团队决定修改—改稿后复检”，形成包含问题位置、冲突依据、关联内容和修改建议的评审报告，以及改后的复检记录。</p></div><figure class="work-plate"><img src="../assets/projects/8-work.webp" alt="角色与剧情设定工作界面" loading="lazy"><figcaption>角色与剧情设定工作界面</figcaption></figure><nav class="series-nav" aria-label="项目导航"><a href="../story-operations.html#project-index">全部运营项目</a><a href="./vx-009.html">下一个项目 · StepMate</a></nav></main></body></html>
