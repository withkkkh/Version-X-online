<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H01 / 硬件团队 · 实体展示</div><h1>四足机械兽</h1></div><figure><img src="../assets/projects/hardware/quadruped.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>基于舵机驱动、可通过手机遥控、执行简单指令并进行简单交互的四足机械兽；成品可以展示简单的机械传动行走结构，兼具趣味性。由于设计时考虑不足，目前机械兽不能无辅助落地行走，但可以用于展示一种特别的机械传动结构。（用手辅助一下还是可以运动的！）</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-014">返回硬件项目索引</a></nav></main></body></html>
