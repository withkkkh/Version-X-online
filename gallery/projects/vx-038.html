<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H21 / 硬件团队 · 实体展示</div><h1>洗衣机取衣提醒装置</h1></div><figure><img src="../assets/projects/hardware/washer.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>本项目是一款宿舍洗衣机取衣提醒装置，针对洗衣机仅提示一次、易忘取衣、影响室友使用的问题设计。设备基于ESP32主控，采用震动与声音双传感器融合判断洗衣结束，搭配按键归属选择、OLED显示和分级蜂鸣提醒，能够智能分时段提醒取衣，有效提升宿舍洗衣机使用效率。</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-038">返回硬件项目索引</a></nav></main></body></html>
