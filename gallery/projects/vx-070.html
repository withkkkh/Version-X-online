<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">H39 / 硬件团队 · 实体展示</div><h1>四足机器人</h1></header><div class="spread-text"><div class="project-intro"><p>本项目实现一款可网页端远程控制的仿生四足机器人。系统搭建轻量化Web交互界面，无需安装APP，电脑、手机浏览器接入即可下发指令，通过无线通信传输控制信号，驱动舵机完成前进、转向、站立、匍匐等步态动作。项目融合嵌入式、伺服驱动、前后端通信技术，完成步态解算与实时指令响应，降低机器人操控门槛，可用于室内巡检、科创展示，为后续拓展视觉回传、自主避障功能打下基础。</p></div></div></div><section class="spread-media object-only" aria-label="项目图像与视频"><figure><img src="../assets/archive-objects/070.svg" alt="遥控四足机器人的方向键"><figcaption>策展插图 · 遥控四足机器人的方向键</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-070">返回硬件项目索引</a></nav></main></body></html>
