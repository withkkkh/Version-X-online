<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H29 / 硬件团队 · 文档展示</div><h1>LumiCube</h1></div><figure><img src="../assets/projects/hardware/cube.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>LumiCube是一款集光影、体感与音律交互于一体的智能光立方，由搭载320颗全彩LED的五面立方体与智能底座构成。通过Pogopin触点，底座与立方体实现了分离式的UART通信与充电。底座与立方体均搭载独立可充电电池，用户可随时将立方体拿起把玩而运行不断联。作品能够模拟液体在倾斜晃动下的重力光流，也可以将音乐实时转化为四面跃动的频谱、展示不同的灯光表现。</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-048">返回硬件项目索引</a></nav></main></body></html>
