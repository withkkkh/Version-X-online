<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H10 / 硬件团队 · 实体展示</div><h1>心流塔</h1></div><figure><img src="../assets/projects/hardware/tower.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>心流塔是一款结合时间可视化与桌面氛围的轻量级互动装置。针对长时间学习或创作时容易忘记时间、忽略休息的痛点，本装置采用Arduino为主控，通过WS2812灯带、OLED屏幕与物理按键，将抽象的时间流逝转化为直观的灯光反馈。它既是一个能帮你感知时间进度的辅助工具，也是一款能安静陪伴的桌面摆件。</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-027">返回硬件项目索引</a></nav></main></body></html>
