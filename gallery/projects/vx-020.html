<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H03 / 硬件团队 · 文档展示</div><h1>cybercube</h1></div><figure><img src="../assets/projects/hardware/liquid.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>制作一个能够模拟真实液体在容器中流动状态的LED艺术装置。</p><p>装置能够根据当前姿态实时改变液面方向，使液面始终垂直于当前重力方向，同时在剧烈运动、失重等情况下模拟液体飞溅效果，使整体观尽可能接近真实物理世界中的液体。其中，水立方的侧面和顶面能够通过LED点阵灯带显示水位和液面，顶部只有在有“水”接触时以及模拟水“溅出”时才会点亮。</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-020">返回硬件项目索引</a></nav></main></body></html>
