<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">H14 / 硬件团队 · 文档展示</div><h1>智能天气时钟</h1></header><div class="spread-text"><div class="project-intro"><p>本项目是一款基于 ESP32-C3 的桌面智能天气时钟，集时间显示、天气预报、本地 RTC 走时、按键交互与趣味表情于一体。设备通过 Wi-Fi 联网获取精确时间和实时天气，同时板载 DS3231 高精度 RTC 模块，即使断网或断电，时间依然准确走时。OLED 屏幕常亮显示当前时间、日期、城市、天气状况与温度；用户可通过两个实体按键轻松切换页面，查看未来两天预报、风力风向等详细信息，还能进入图片模式，与可爱的小动画互动。</p></div></div></div><section class="spread-media object-only" aria-label="项目图像与视频"><figure><img src="../assets/archive-objects/031.svg" alt="桌面时钟的天气翻页键"><figcaption>策展插图 · 桌面时钟的天气翻页键</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-031">返回硬件项目索引</a></nav></main></body></html>
