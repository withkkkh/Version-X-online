<main class="project-article"><div class="project-hero"><div><div class="project-kicker">H06 / 硬件团队 · 实体展示</div><h1>自然光唤醒灯</h1></div><figure><img src="../assets/projects/hardware/lamp.svg" alt=""><figcaption>策展示意图标</figcaption></figure></div><div class="project-intro"><p>自然光唤醒灯面向晨间起床场景，通过逐步增强的灯光模拟日出，让使用者在光线由暗到亮的过程中醒来，兼具时间显示、温湿度监测功能。项目以 STM32 为主控，使用 DS3231 实时时钟提供日期和时间，SHT30 传感器采集室内温度与湿度，墨水屏集中显示这些信息，便于在床边查看。照明部分采用 5 V LED，由主控输出 PWM 信号调节亮度。亮度曲线可自定义，用于改变各阶段的亮度和变化节奏，呈现不同的日出效果。整体外壳由3D打印实现。</p></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-023">返回硬件项目索引</a></nav></main></body></html>
