<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">S02 / 软件团队 · 软件展示</div><h1>CC98 AI+插件</h1><nav class="project-resources" aria-label="项目入口"><a href="https://github.com/lwsher/CC98_AI_frontend" target="_blank" rel="noopener noreferrer">GitHub 仓库</a></nav></header><div class="spread-text"><div class="project-intro"><p>由于CC98的搜索栏只能进行词语精确匹配，且无法订阅某一话题，用户想要搜索某个主题只能将相关的词语一个一个搜索并注意翻阅，因此我们开发了一款根据用户提示语句或关键词AI自动搜索的插件，既能帮助用户快速得到相关主题的、具有较高质量的信息，又具备订阅某一个主题、当某个订阅主题的新帖出现时能够使用钉钉或者邮箱进行提示的功能，用户需要通过浙大邮箱进行注册登录，可以设置搜索强度和通知渠道、通知时间间隔等内容。</p></div></div></div><section class="spread-media" aria-label="项目图像与视频"><figure class="work-plate"><img src="../assets/projects/53-work.webp" alt="项目组提交的插件介绍页" loading="lazy"><figcaption>项目组提交的插件介绍页</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-software.html#project-index">全部软件项目</a><a href="./vx-054.html">下一个项目 · 学长组 Agent</a></nav></main></body></html>
