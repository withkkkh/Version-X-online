<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">H17 / 硬件团队 · 实体展示</div><h1>室内自动绿植养护装置</h1></header><div class="spread-text"><p class="archive-object-credit">档案封面选自概念效果图 · 正面。</p><div class="project-intro"><p class="file-note">本次提供的是装置概念图。</p><p>本项目是一套基于ESP32开发的全自动智能植物养护设备，面向家庭盆栽自动化养护场景。系统集成定时浇水、周期循环浇水、定时补光、水位缺水报警、参数可视化设置功能。设备完成首次网络对时之后，日常运行完全关闭WiFi，依靠硬件时钟计时，全部配置参数断电保存，实现无人值守自动养护植物。</p></div></div></div><section class="spread-media" aria-label="项目图像与视频"><figure class="work-plate archive-plate"><img src="../assets/project-archive/034-01.webp" width="1560" height="1170" alt="概念效果图 · 正面" loading="lazy" decoding="async"><figcaption>概念效果图 · 正面</figcaption></figure><figure class="work-plate archive-plate"><img src="../assets/project-archive/034-02.webp" width="1560" height="1170" alt="概念效果图 · 侧面" loading="lazy" decoding="async"><figcaption>概念效果图 · 侧面</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-034">返回硬件项目索引</a></nav></main></body></html>
