<main class="project-article"><div class="project-spread"><div class="spread-info"><header class="spread-heading"><div class="project-kicker">H20 / 硬件团队 · 实体展示</div><h1>Vibe Remote——AI 编程交互手柄</h1></header><div class="spread-text"><p class="archive-object-credit">档案封面选自交互手柄效果图。</p><div class="project-intro"><p class="file-note">项目组提供的手柄图为设计效果图。</p><p>Vibe Remote 是一款面向 Vibe Coding场景设计的单手蓝牙控制器。它将输入、发送或继续、取消、页面滚动和面板切换等常用操作，映射到三个按键和一个可按压的滚轮上，目标是在浏览代码、审阅修改和等待 AI 执行任务时，减少键盘与鼠标之间的切换（让我们畅快摸鱼）。</p></div></div></div><section class="spread-media" aria-label="项目图像与视频"><figure class="work-plate archive-plate"><img src="../assets/project-archive/037-01.webp" width="1536" height="1024" alt="交互手柄效果图" loading="lazy" decoding="async"><figcaption>交互手柄效果图</figcaption></figure></section></div><nav class="series-nav" aria-label="项目导航"><a href="../story-hardware.html#object-vx-037">返回硬件项目索引</a></nav></main></body></html>
