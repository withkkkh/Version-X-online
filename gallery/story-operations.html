<main><div class="lead"><div><p class="team">运营团队</p><h1>当一份创作需要另一个人参与</h1><p>观众怎样读懂作品？修改意见怎样回到创作者手里？运营展区把两种具体的协作过程放在了一起。</p></div>
<figure><model-viewer src="./assets/version-x-team-exhibits.glb?v=original-art-1" camera-target="-7.57m 1.33m 0m" camera-orbit="82deg 67deg 7m" field-of-view="42deg" exposure=".87" environment-image="neutral" interaction-prompt="none" alt="运营展架上的《群居泡泡》与《CharacterOS》"></model-viewer><figcaption>运营展区 · 群居泡泡 / CharacterOS</figcaption></figure></div>
<div class="works"><section><h2>群居泡泡</h2><p>在杨斯羽的作品集原展板上，泡泡的「粘连与共生」构成了装置的主题。可以先看单个泡泡的边界，再看它和相邻泡泡相接的地方：当它们聚在一起，你看到的是一个个独立的形状，还是一个整体？</p></section><section><h2>CharacterOS</h2><p>把目光转向游戏剧情研发。一份稿件先经过风险初筛，再由顾问复核；研发人员完成修改后，改稿还要接受复检。沿着这张流程图读下去，可以看到，一条意见怎样变成一次具体的修改。</p></section></div></main>
